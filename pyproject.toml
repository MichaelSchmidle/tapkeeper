[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "tapkeeper"
version = "0.1.0"
description = "Single-owner deterministic Telegram watch-wear logger"
requires-python = ">=3.12"
dependencies = ["python-telegram-bot==22.8"]

[project.scripts]
tapkeeper = "tapkeeper.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.7"]
